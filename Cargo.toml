[workspace]
members = [
    "crates/scb-core",
    "crates/scb-cli",
    "crates/scb-registry",
    "crates/scb-engine",
    "crates/scb-tui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["skill-creator-bot contributors"]
license = "MIT"
repository = "https://github.com/LuuuXXX/skill-creator-bot"

[workspace.dependencies]
# CLI framework
clap = { version = "4", features = ["derive"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Error handling
anyhow = "1"
thiserror = "1"
# File system
walkdir = "2"
# Terminal output
colored = "2"
# Process execution
which = "4"
